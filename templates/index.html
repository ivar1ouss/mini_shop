{% extends 'base.html' %}

{% block title %}Каталог товаров{% endblock %}

{% block content %}
    <h2>Каталог товаров</h2>
    <div class="products">
        {% for product in products %}
            <div class="product-card">
                <h3>{{ product.name }}</h3>
                <p>Категория: {{ product.category }}</p>
                <p class="price">{{ product.price }} ₽</p>
                <a href="{{ url_for('add_to_cart', product_id=product.id) }}" class="btn">Добавить в корзину</a>
            </div>
        {% endfor %}
    </div>
{% endblock %}
